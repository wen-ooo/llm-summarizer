<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>大模型总结器</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #333; }
    textarea { width: 100%; height: 140px; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 24px; font-size: 15px; background: #1677ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #999; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 6px; min-height: 40px; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
    #error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>大模型总结器</h1>
  <textarea id="inputText" placeholder="在这里粘贴一段文字，点击下方按钮生成总结..."></textarea>
  <br>
  <button id="submitBtn">生成总结</button>
  <div id="error"></div>
  <div id="result"></div>

  <script>
    const btn = document.getElementById('submitBtn');
    const input = document.getElementById('inputText');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('error');

    btn.addEventListener('click', async () => {
      const text = input.value.trim();
      errorDiv.textContent = '';
      resultDiv.textContent = '';

      if (!text) {
        errorDiv.textContent = '请先输入一段文字。';
        return;
      }

      btn.disabled = true;
      btn.textContent = '生成中...';

      try {
        const response = await fetch('/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          throw new Error('服务器返回错误：' + response.status);
        }

        const data = await response.json();
        resultDiv.textContent = data.summary;
      } catch (err) {
        errorDiv.textContent = '出错了：' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '生成总结';
      }
    });
  </script>
</body>
</html>
